<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
巴西SKU产品素材目录
</title>


<style>


*{

box-sizing:border-box;

margin:0;

padding:0;

}



body{


font-family:

-apple-system,

BlinkMacSystemFont,

"Segoe UI",

Roboto,

"Microsoft YaHei",

sans-serif;


background:#f8f9fa;


color:#333;


padding:20px;


}





/* =====================
顶部区域
===================== */


header{

max-width:1200px;

margin:auto;

display:flex;

flex-direction:column;

align-items:center;

gap:10px;

padding-top:20px;

}



/* 公司Logo */


.company-logo{

    position:absolute;

    top:20px;

    left:30px;


    width:300px;

    height:50px;


    object-fit:contain;

}



h1{

font-size:26px;

color:#1a73e8;

margin-top:0;

}




.search-bar{

width:100%;

padding:12px 16px;

font-size:16px;

margin-top:0;

border:
1px solid #ddd;

border-radius:8px;

outline:none;

}





/* =====================
首页SKU
===================== */


.sku-grid{


max-width:1200px;


margin:15px auto;


display:grid;


grid-template-columns:

repeat(auto-fill,minmax(220px,1fr));


gap:20px;


}





.sku-card{


background:white;


border-radius:10px;


overflow:hidden;


box-shadow:

0 2px 8px rgba(0,0,0,.08);


cursor:pointer;


transition:.2s;


display:flex;


flex-direction:column;


align-items:center;


padding:10px;


}





.sku-card:hover{


transform:translateY(-4px);


}





.sku-card img{


width:200px;


height:200px;


object-fit:contain;


background:#eee;


border-radius:8px;


}





.sku-info{


margin-top:10px;


font-size:16px;


font-weight:bold;


}





/* =====================
详情页
===================== */


.detail-container{


max-width:1000px;


margin:auto;


display:none;


}





.back-btn{


display:inline-block;


padding:10px 20px;


background:white;


border:1px solid #ddd;


border-radius:6px;


text-decoration:none;


color:#333;


margin-bottom:20px;


}





.detail-title{


font-size:24px;


color:#1a73e8;


}





.section-title{


font-size:17px;


font-weight:bold;


margin:

25px 0 12px;


border-left:

4px solid #1a73e8;


padding-left:8px;


}





/* 下载按钮 */


.file-links{


display:flex;


flex-direction:column;


gap:10px;


}





.file-btn{


padding:12px;


background:#e8f0fe;


color:#1a73e8;


border-radius:6px;


text-decoration:none;


font-weight:bold;


text-align:center;


}





.archive-btn{


background:#e6f4ea;


color:#137333;


}





/* 参数HTML */


.spec-frame{


width:100%;


height:600px;


border:

1px solid #ddd;


border-radius:8px;


background:white;


}





/* 图片视频网格 */


.media-grid{


display:grid;


grid-template-columns:

repeat(auto-fill,200px);


gap:20px;


}





.media-grid img,


.media-grid video{


width:200px;


height:200px;


object-fit:contain;


background:white;


border-radius:8px;


}





.media-grid img{


cursor:zoom-in;


}





.media-grid video{


background:#000;


}





/* 图片放大 */


#lightbox{


position:fixed;


top:0;


left:0;


width:100%;


height:100%;


background:

rgba(0,0,0,.85);


display:none;


justify-content:center;


align-items:center;


z-index:999;


}





#lightbox img{


max-width:95%;


max-height:95%;


}




.loading{


text-align:center;


padding:50px;


font-size:18px;


color:#666;


}



</style>


</head>


<body>


<header id="header-section">


<img

src="company-logo.png"

class="company-logo"

onerror="this.style.display='none'"

>


<h1>

📦 巴西 SKU 产品素材目录

</h1>


<input

id="searchInput"

class="search-bar"

placeholder="🔍 搜索SKU / 产品名称 / 类目..."

oninput="filterSKUs()"

>


</header>

<main id="home-view">


<div id="loading" class="loading">

正在自动扫描SKU目录...

</div>


<div id="skuGrid" class="sku-grid"></div>


</main>





<!-- SKU详情 -->

<div id="detail-view" class="detail-container">


<a

href="#"

class="back-btn"

onclick="goHome(event)"

>

← 返回首页

</a>



<h2

id="detailTitle"

class="detail-title">

</h2>





<div id="archiveSection" style="display:none">


<div class="section-title">

📦 压缩包资料下载

</div>


<div id="archiveLinks" class="file-links"></div>


</div>






<div id="specSection" style="display:none">


<div class="section-title">

📋 产品参数信息

</div>


<iframe

id="specFrame"

class="spec-frame">

</iframe>


</div>







<div id="imageSection" style="display:none">


<div class="section-title">

🖼️ 产品高清图集

</div>


<div id="imageList" class="media-grid"></div>


</div>







<div id="videoSection" style="display:none">


<div class="section-title">

🎬 产品视频展示

</div>


<div id="videoList" class="media-grid"></div>


</div>



</div>








<div id="lightbox" onclick="closeLightbox()">


<img id="lightboxImg">


</div>









<script>


/*
===============================
GitHub配置
===============================
*/


const GITHUB_USER =

"chena88888-rgb";



const REPO_NAME =

"MITU-Brazil-Catalog3";





let allSKUs=[];

let catalog={};
let productMetadata={};






/*
===============================
初始化

扫描GitHub根目录

===============================
*/


async function init(){



const loading =

document.getElementById("loading");



try{



console.log("开始读取catalog");

const response = await fetch("catalog.json");

catalog = await response.json();
// 手工维护的名称、分类及关键词可能保存在 products.json。
try {
  const metaResponse = await fetch("products.json", {cache:"no-store"});
  if (metaResponse.ok) productMetadata = await metaResponse.json();
} catch(e) { console.warn("products.json 暂时不可用", e); }

console.log(catalog);
allSKUs = Object.keys(catalog)
.sort(
(a,b)=>Number(a)-Number(b)
);



loading.style.display="none";



renderSKUList(allSKUs);




checkUrlHash();



}



catch(error){



console.error(error);



loading.innerText =

"读取SKU失败，请检查GitHub配置";


}



}










/*
===============================
寻找SKU封面

优先：

cover.jpg
cover.png
1.jpg
1.png

===============================
*/


function skuFiles(sku){
  const info = catalog[sku] || {};
  return Array.isArray(info.files) ? info.files : [];
}
function fileName(file){ return typeof file === "string" ? file : String(file.name || ""); }
function fileUrl(sku,file){
  const raw = typeof file === "string" ? file : String(file.url || file.name || "");
  if (/^https?:\/\//i.test(raw)) return raw;
  const clean = raw.replace(/^\.\//, "").replace(/^\//, "");
  return clean.startsWith(sku + "/") ? clean : `${sku}/${clean}`;
}
function findCover(sku){
  const files = skuFiles(sku);
  const pictures = files.filter(f => /\.(jpg|jpeg|png|webp)$/i.test(fileName(f)));
  const rank = n => /^(cover|1)\.(jpg|jpeg|png|webp)$/i.test(n) ? 0 : 1;
  pictures.sort((a,b) => rank(fileName(a))-rank(fileName(b)));
  return pictures.length ? fileUrl(sku,pictures[0]) : `${sku}/1.jpg`;
}
function applyCoverFallback(img,sku){
  const candidates = [...new Set([findCover(sku),`${sku}/cover.jpg`,`${sku}/cover.png`,`${sku}/1.jpg`,`${sku}/1.png`,`${sku}/1.jpeg`,`${sku}/1.webp`,`default-cover.png`])];
  let index = 0;
  img.onerror = () => { index++; if(index < candidates.length) img.src = candidates[index]; else img.onerror = null; };
  img.src = candidates[0];
}
function productInfo(sku){
  const c = catalog[sku] || {};
  const root = productMetadata || {};
  const p = (root[sku] || (root.products && root.products[sku]) || (Array.isArray(root.products) ? root.products.find(x => String(x.sku || x.id) === sku) : null) || {});
  return {
    name: String(p.name || p.title || c.name || ""),
    category: String(p.category || c.category || ""),
    keywords: [...(Array.isArray(c.keywords)?c.keywords:[]), ...(Array.isArray(p.keywords)?p.keywords:typeof p.keywords === "string"?p.keywords.split(/[,，;；]/):[])]
  };
}
/*
===============================
首页SKU卡片

===============================
*/


function renderSKUList(skus){
  const grid = document.getElementById("skuGrid");
  // 每次搜索立即同步生成最新结果，不留下任何旧异步任务。
  grid.replaceChildren();
  const uniqueSKUs = [...new Set(skus.map(String))];
  const fragment = document.createDocumentFragment();
  for (const sku of uniqueSKUs){
    const card = document.createElement("div");
    card.className = "sku-card";
    const img = document.createElement("img");
    applyCoverFallback(img,sku);
    const info = document.createElement("div");
    info.className = "sku-info";
    info.textContent = `SKU: ${sku}`;
    card.append(img, info);
    card.onclick = () => loadSKUDetail(sku);
    fragment.appendChild(card);
  }
  grid.appendChild(fragment);
}
/*
===============================
加载SKU详情

===============================
*/


async function loadSKUDetail(sku){



document

.getElementById("home-view")

.style.display="none";




document

.getElementById("header-section")

.style.display="none";






document

.getElementById("detail-view")

.style.display="block";






document

.getElementById("detailTitle")

.innerText=

`SKU: ${sku}`;





window.location.hash=

`sku=${sku}`;





// 清空旧内容


[
"archiveLinks",

"imageList",

"videoList"

]

.forEach(id=>{


document.getElementById(id)

.innerHTML="";


});



document

.getElementById("specFrame")

.src="";




[
"archiveSection",

"specSection",

"imageSection",

"videoSection"

]

.forEach(id=>{


document.getElementById(id)

.style.display="none";


});







// 直接使用已部署的目录索引，不依赖 GitHub API 授权或仓库名称。
let files = skuFiles(sku).map(f => ({
  name:fileName(f),
  download_url:fileUrl(sku,f)
}));
// 若索引缺少文件，再尝试测试仓库的 GitHub API。
if (!files.length) {
  try {
    const r = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${sku}`);
    if(r.ok) { const data = await r.json(); if(Array.isArray(data)) files = data; }
  } catch(e) { console.warn("读取文件列表失败",e); }
}
// 即使索引未列出参数页，也优先尝试本地参数页。
const specCandidate = `${sku}/product-spec.html`;
let archives="";

let images="";

let videos="";

let spec="";





console.log("SKU文件列表", files);

files.forEach(file=>{

const name = file.name;

const ext = name.split(".").pop().toLowerCase();


// 压缩包

if(
[
"zip",
"rar",
"7z"
].includes(ext)
){

console.log("发现压缩包", name);

archives +=
`
<a
href="${file.download_url}"
class="file-btn archive-btn"
target="_blank">

📥 下载 ${name}

</a>
`;

}


// 图片

if(
[
"jpg",
"jpeg",
"png",
"webp"
].includes(ext)
){

images +=
`

<img
src="${file.download_url}"
onclick="openLightbox('${file.download_url}')"
>

`;

}


// 视频

if(
[
"mp4",
"mov",
"webm"
].includes(ext)
){

videos +=
`

<video controls>

<source src="${file.download_url}">

</video>

`;

}


// 参数HTML

if(
name.toLowerCase()==="product-spec.html"
){

console.log("找到参数文件", file.download_url);

spec=file.download_url || specCandidate;

}


});


// 输出压缩包

if(archives){

document.getElementById("archiveLinks").innerHTML=archives;

document.getElementById("archiveSection").style.display="block";

}


// 输出图片

if(images){

document.getElementById("imageList").innerHTML=images;

document.getElementById("imageSection").style.display="block";

}


// 输出视频

if(videos){

document.getElementById("videoList").innerHTML=videos;

document.getElementById("videoSection").style.display="block";

}


// 输出参数

if(spec || specCandidate){

document.getElementById("specFrame").src=spec || specCandidate;

document.getElementById("specSection").style.display="block";

}


}






/*
===============================
图片放大
===============================
*/


function openLightbox(url){



const box =

document.getElementById("lightbox");



const img =

document.getElementById("lightboxImg");




img.src=url;



box.style.display="flex";



}






function closeLightbox(){



document

.getElementById("lightbox")

.style.display="none";



}








/*
===============================
SKU搜索
===============================
*/


function filterSKUs(){
  const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!keyword){
    renderSKUList(allSKUs);
    return;
  }
  const result = allSKUs.filter(sku => {
    const info = productInfo(sku);
    const name = info.name.toLowerCase();
    const category = info.category.toLowerCase();
    const keywords = info.keywords;
    return sku.toLowerCase().includes(keyword)
      || name.includes(keyword)
      || category.includes(keyword)
      || keywords.some(word => String(word).toLowerCase().includes(keyword));
  });
  renderSKUList(result);
}
/*
===============================
返回首页
===============================
*/


function goHome(e){



e.preventDefault();




window.location.hash="";





document

.getElementById("detail-view")

.style.display="none";





document

.getElementById("home-view")

.style.display="block";





document

.getElementById("header-section")

.style.display="flex";



}









/*
===============================
URL直接打开SKU

例如：

xxx.com/#sku=100062

===============================
*/


function checkUrlHash(){



const hash =

window.location.hash;





if(

hash.startsWith("#sku=")

){



const sku =

hash.replace("#sku=","");





if(sku){


  
loadSKUDetail(sku);



}



}



}








/*
===============================
启动
===============================
*/


window.init = init;

init();


</script>


</body>


</html>
