name: Build Catalog


on:

  push:

    branches:

      - main



jobs:


  build:


    runs-on: ubuntu-latest



    steps:



      # 拉取仓库代码

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0





      # 安装 Node.js

      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 20





      # 运行 build.js

      - name: Generate catalog.json

        run: node build.js





      # 提交更新后的 catalog.json

      - name: Commit catalog.json


        run: |


          git config user.name "github-actions[bot]"


          git config user.email "github-actions[bot]@users.noreply.github.com"



          git add catalog.json



          git diff --cached --quiet || git commit -m "Auto update catalog.json"





      # 推送回GitHub

      - name: Push changes


        run: |


          git push