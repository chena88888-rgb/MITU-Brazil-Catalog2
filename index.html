<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
巴西SKU产品素材目录
</title>


<style>


*{

box-sizing:border-box;

margin:0;

padding:0;

}



body{


font-family:

-apple-system,

BlinkMacSystemFont,

"Segoe UI",

Roboto,

"Microsoft YaHei",

sans-serif;


background:#f8f9fa;


color:#333;


padding:20px;


}





/* =====================
顶部区域
===================== */


header{


max-width:1200px;


margin:auto;


display:flex;


flex-direction:column;


align-items:center;


gap:15px;


}



/* 公司Logo */


.company-logo{


width:120px;


height:120px;


object-fit:contain;


}



h1{


font-size:26px;


color:#1a73e8;


}





.search-bar{


width:100%;


padding:12px 16px;


font-size:16px;


border:

1px solid #ddd;


border-radius:8px;


outline:none;


}





/* =====================
首页SKU
===================== */


.sku-grid{


max-width:1200px;


margin:30px auto;


display:grid;


grid-template-columns:

repeat(auto-fill,minmax(220px,1fr));


gap:20px;


}





.sku-card{


background:white;


border-radius:10px;


overflow:hidden;


box-shadow:

0 2px 8px rgba(0,0,0,.08);


cursor:pointer;


transition:.2s;


display:flex;


flex-direction:column;


align-items:center;


padding:10px;


}





.sku-card:hover{


transform:translateY(-4px);


}





.sku-card img{


width:200px;


height:200px;


object-fit:contain;


background:#eee;


border-radius:8px;


}





.sku-info{


margin-top:10px;


font-size:16px;


font-weight:bold;


}





/* =====================
详情页
===================== */


.detail-container{


max-width:1000px;


margin:auto;


display:none;


}





.back-btn{


display:inline-block;


padding:10px 20px;


background:white;


border:1px solid #ddd;


border-radius:6px;


text-decoration:none;


color:#333;


margin-bottom:20px;


}





.detail-title{


font-size:24px;


color:#1a73e8;


}





.section-title{


font-size:17px;


font-weight:bold;


margin:

25px 0 12px;


border-left:

4px solid #1a73e8;


padding-left:8px;


}





/* 下载按钮 */


.file-links{


display:flex;


flex-direction:column;


gap:10px;


}





.file-btn{


padding:12px;


background:#e8f0fe;


color:#1a73e8;


border-radius:6px;


text-decoration:none;


font-weight:bold;


text-align:center;


}





.archive-btn{


background:#e6f4ea;


color:#137333;


}





/* 参数HTML */


.spec-frame{


width:100%;


height:600px;


border:

1px solid #ddd;


border-radius:8px;


background:white;


}





/* 图片视频网格 */


.media-grid{


display:grid;


grid-template-columns:

repeat(auto-fill,200px);


gap:20px;


}





.media-grid img,


.media-grid video{


width:200px;


height:200px;


object-fit:contain;


background:white;


border-radius:8px;


}





.media-grid img{


cursor:zoom-in;


}





.media-grid video{


background:#000;


}





/* 图片放大 */


#lightbox{


position:fixed;


top:0;


left:0;


width:100%;


height:100%;


background:

rgba(0,0,0,.85);


display:none;


justify-content:center;


align-items:center;


z-index:999;


}





#lightbox img{


max-width:95%;


max-height:95%;


}




.loading{


text-align:center;


padding:50px;


font-size:18px;


color:#666;


}



</style>


</head>


<body>


<header id="header-section">


<img

src="company-logo.png"

class="company-logo"

onerror="this.style.display='none'"

>


<h1>

📦 巴西 SKU 产品素材目录

</h1>


<input

id="searchInput"

class="search-bar"

placeholder="🔍 输入 SKU 快速搜索..."

oninput="filterSKUs()"

>


</header>

<main id="home-view">


<div id="loading" class="loading">

正在自动扫描SKU目录...

</div>


<div id="skuGrid" class="sku-grid"></div>


</main>





<!-- SKU详情 -->

<div id="detail-view" class="detail-container">


<a

href="#"

class="back-btn"

onclick="goHome(event)"

>

← 返回首页

</a>



<h2

id="detailTitle"

class="detail-title">

</h2>





<div id="archiveSection" style="display:none">


<div class="section-title">

📦 压缩包资料下载

</div>


<div id="archiveLinks" class="file-links"></div>


</div>






<div id="specSection" style="display:none">


<div class="section-title">

📋 产品参数信息

</div>


<iframe

id="specFrame"

class="spec-frame">

</iframe>


</div>







<div id="imageSection" style="display:none">


<div class="section-title">

🖼️ 产品高清图集

</div>


<div id="imageList" class="media-grid"></div>


</div>







<div id="videoSection" style="display:none">


<div class="section-title">

🎬 产品视频展示

</div>


<div id="videoList" class="media-grid"></div>


</div>



</div>








<div id="lightbox" onclick="closeLightbox()">


<img id="lightboxImg">


</div>









<script>


/*
===============================
GitHub配置
===============================
*/


const GITHUB_USER =

"chena88888-rgb";



const REPO_NAME =

"MITU-Brazil-Catalog2";





let allSKUs=[];






/*
===============================
初始化

扫描GitHub根目录

===============================
*/


async function init(){



const loading =

document.getElementById("loading");



try{



console.log("开始读取catalog");

const response = await fetch("catalog.json");

const catalog = await response.json();

console.log(catalog);
allSKUs = Object.keys(catalog)
.sort(
(a,b)=>Number(a)-Number(b)
);



const response = await fetch("catalog.json");

const catalog = await response.json();

allSKUs = Object.keys(catalog)
.sort(
(a,b)=>Number(a)-Number(b)
);





loading.style.display="none";



renderSKUList(allSKUs);




checkUrlHash();



}



catch(error){



console.error(error);



loading.innerText =

"读取SKU失败，请检查GitHub配置";


}



}










/*
===============================
寻找SKU封面

优先：

1.jpg
1.png

===============================
*/


async function findCover(sku){



const priority = [


"1.jpg",

"1.png",

"1.jpeg",

"1.webp"

];





for(const name of priority){



const url =


`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/${sku}/${name}`;





try{



const res =

await fetch(url,{method:"HEAD"});




if(res.ok){


return url;


}


}

catch(e){}



}








// 如果没有1.jpg

// 找其它图片


const files =


await fetch(

`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${sku}`

)

.then(r=>r.json());






const img =

files.find(

file=>

[

"jpg",

"jpeg",

"png",

"webp"

]

.includes(

file.name.split(".").pop().toLowerCase()

)

);





if(img){


return img.download_url;


}






return "default-cover.png";



}









/*
===============================
首页SKU卡片

===============================
*/


async function renderSKUList(skus){



const grid =

document.getElementById("skuGrid");



grid.innerHTML="";





for(const sku of skus){





const cover =

await findCover(sku);





const card =

document.createElement("div");



card.className=

"sku-card";






card.innerHTML=

`

<img

src="${cover}"

onerror="this.src='default-cover.png'"

>


<div class="sku-info">

SKU: ${sku}

</div>

`;






card.onclick=

()=>loadSKUDetail(sku);





grid.appendChild(card);




}



}






/*
===============================
加载SKU详情

===============================
*/


async function loadSKUDetail(sku){



document

.getElementById("home-view")

.style.display="none";




document

.getElementById("header-section")

.style.display="none";






document

.getElementById("detail-view")

.style.display="block";






document

.getElementById("detailTitle")

.innerText=

`SKU: ${sku}`;





window.location.hash=

`sku=${sku}`;





// 清空旧内容


[
"archiveLinks",

"imageList",

"videoList"

]

.forEach(id=>{


document.getElementById(id)

.innerHTML="";


});



document

.getElementById("specFrame")

.src="";




[
"archiveSection",

"specSection",

"imageSection",

"videoSection"

]

.forEach(id=>{


document.getElementById(id)

.style.display="none";


});







const files =

await fetch(

`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${sku}`

)

.then(r=>r.json());





let archives="";

let images="";

let videos="";

let spec="";





files.forEach(file=>{



const name =

file.name;



const ext =

name.split(".")

.pop()

.toLowerCase();





if(

[

"zip",

"rar",

"7z"

]

.includes(ext)

){



archives +=

`

<a

href="${file.download_url}"

class="file-btn archive-btn"

target="_blank">

📥 下载 ${name}

</a>

`;



}

}







/*
===============================
图片放大
===============================
*/


function openLightbox(url){



const box =

document.getElementById("lightbox");



const img =

document.getElementById("lightboxImg");




img.src=url;



box.style.display="flex";



}






function closeLightbox(){



document

.getElementById("lightbox")

.style.display="none";



}








/*
===============================
SKU搜索
===============================
*/


function filterSKUs(){



const keyword =

document

.getElementById("searchInput")

.value

.trim()

.toLowerCase();





const result =


allSKUs.filter(


sku =>


sku

.toLowerCase()

.includes(keyword)



);





renderSKUList(result);



}









/*
===============================
返回首页
===============================
*/


function goHome(e){



e.preventDefault();




window.location.hash="";





document

.getElementById("detail-view")

.style.display="none";





document

.getElementById("home-view")

.style.display="block";





document

.getElementById("header-section")

.style.display="flex";



}









/*
===============================
URL直接打开SKU

例如：

xxx.com/#sku=100062

===============================
*/


function checkUrlHash(){



const hash =

window.location.hash;





if(

hash.startsWith("#sku=")

){



const sku =

hash.replace("#sku=","");





if(sku){


  
loadSKUDetail(sku);



}



}



}








/*
===============================
启动
===============================
*/


init();



</script>


</body>


</html>
