<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>巴西SKU产品图库</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

    background:#f8f9fa;
    color:#333;
    padding:20px;
}


header{
    max-width:1200px;
    margin:0 auto 20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}


h1{
    font-size:24px;
    color:#1a73e8;
}


.search-bar{

    width:100%;
    padding:12px 16px;

    font-size:16px;

    border:
    1px solid #ddd;

    border-radius:8px;

    outline:none;

}



/* SKU首页 */

.sku-grid{

    max-width:1200px;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(200px,1fr));

    gap:20px;

}



.sku-card{

    background:white;

    border-radius:10px;

    overflow:hidden;

    box-shadow:
    0 2px 8px rgba(0,0,0,.08);

    cursor:pointer;

    transition:.2s;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-bottom:10px;

}


.sku-card:hover{

    transform:translateY(-4px);

}



.sku-card img{

    width:200px;

    height:200px;

    object-fit:cover;

    background:#eee;

    border-radius:6px;

    margin-top:10px;

}



.sku-info{

    padding:10px 15px 0;

    font-size:16px;

    font-weight:bold;

    text-align:center;

}




/* 详情页 */

.detail-container{

    max-width:900px;

    margin:auto;

    display:none;

}



.back-btn{

    display:inline-block;

    padding:10px 20px;

    background:white;

    border:1px solid #ddd;

    border-radius:6px;

    text-decoration:none;

    color:#333;

    margin-bottom:20px;

}



.detail-title{

    font-size:22px;

    margin-bottom:20px;

    color:#1a73e8;

}



.section-title{

    font-size:16px;

    font-weight:bold;

    color:#555;

    margin:
    20px 0 10px;

    border-left:
    4px solid #1a73e8;

    padding-left:8px;

}




.file-links{

    display:flex;

    flex-direction:column;

    gap:8px;

}



.file-btn{

    display:block;

    padding:12px 18px;

    background:#e8f0fe;

    color:#1a73e8;

    text-decoration:none;

    border-radius:6px;

    font-weight:bold;

    text-align:center;

}



.pdf-btn{

    background:#fce8e6;

    color:#c5221f;

}



.media-list{

    display:flex;

    flex-direction:column;

    gap:15px;

}



.media-list img,
.media-list video{

    width:100%;

    border-radius:8px;

    background:#000;

}



.media-list img{

    cursor:zoom-in;

}



#lightbox{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:
    rgba(0,0,0,.85);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:999;

}



#lightbox img{

    max-width:95%;

    max-height:95%;

}



.loading{

    text-align:center;

    padding:50px;

    font-size:18px;

    color:#666;

}


</style>

</head>



<body>



<header id="header-section">

<h1>
📦 巴西 SKU 产品素材目录
</h1>


<input
id="searchInput"
class="search-bar"
placeholder="🔍 输入 SKU 快速搜索..."
oninput="filterSKUs()">


</header>




<!-- 首页 -->

<main id="home-view">


<div id="loading" class="loading">

正在自动扫描SKU目录...

</div>


<div id="skuGrid" class="sku-grid"></div>


</main>





<!-- 详情页 -->

<div id="detail-view" class="detail-container">


<a href="#"
class="back-btn"
onclick="goHome(event)">
← 返回首页
</a>



<h2 id="detailTitle"
class="detail-title">
</h2>




<div id="archiveSection"
style="display:none">

<div class="section-title">
📦 压缩包资料下载
</div>

<div id="archiveLinks"
class="file-links">
</div>

</div>





<div id="pdfSection"
style="display:none">

<div class="section-title">
📄 产品规格书 PDF
</div>

<div id="pdfLinks"
class="file-links">
</div>

</div>





<div id="imageSection"
style="display:none">


<div class="section-title">
🖼️ 产品高清图集
</div>


<div id="imageList"
class="media-list">
</div>


</div>






<div id="videoSection"
style="display:none">


<div class="section-title">
🎬 产品视频展示
</div>


<div id="videoList"
class="media-list">
</div>


</div>



</div>





<div id="lightbox"
onclick="closeLightbox()">


<img id="lightboxImg">


</div>







<script>


/*
===============================
GitHub配置
===============================
*/


const GITHUB_USER =
"chena88888-rgb";


const REPO_NAME =
"MITU-Brazil-Catalog2";



let allSKUs=[];






/*
初始化
*/


async function init(){


const loading =
document.getElementById("loading");


try{


const url =
`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents`;



const response =
await fetch(url);



const data =
await response.json();



allSKUs =
data

.filter(item=>item.type==="dir")


loading.style.display="none";



renderSKUList(allSKUs);



checkUrlHash();



}
catch(error){


console.error(error);


loading.innerText =
"自动扫描失败，请检查GitHub配置";


}



}






/*
寻找SKU封面
优先顺序：

1.jpg
1.png
cover.jpg
cover.png

*/


async function findCover(sku){


const names=[

"1.jpg",

"1.png",

"cover.jpg",

"cover.png"

];



for(const name of names){


const url =
`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/${sku}/${name}`;



try{


const res =
await fetch(url,{method:"HEAD"});



if(res.ok){

return url;

}



}
catch(e){


console.log(e);


}


}



return "default-cover.png";


}






/*
显示SKU列表

*/


async function renderSKUList(skus){


const grid =
document.getElementById("skuGrid");


grid.innerHTML="";



if(skus.length===0){


grid.innerHTML =
`
<div style="grid-column:1/-1;text-align:center">
没有找到SKU
</div>
`;

return;


}



for(const sku of skus){



const coverUrl =
await findCover(sku);



const card =
document.createElement("div");



card.className =
"sku-card";



card.innerHTML =
`

<img
src="${coverUrl}"
alt="${sku}"
onerror="this.src='default-cover.png'">


<div class="sku-info">

SKU: ${sku}

</div>

`;



card.onclick =
()=>loadSKUDetail(sku);



grid.appendChild(card);



}



}
/*
===============================
加载SKU详情
===============================
*/


async function loadSKUDetail(sku){


document.getElementById("home-view").style.display="none";

document.getElementById("header-section").style.display="none";



const detailView =
document.getElementById("detail-view");


detailView.style.display="block";



document.getElementById("detailTitle").innerText =
`SKU: ${sku}`;



window.location.hash =
`sku=${sku}`;




// 重置区域


document.getElementById("archiveSection").style.display="none";

document.getElementById("pdfSection").style.display="none";

document.getElementById("imageSection").style.display="none";

document.getElementById("videoSection").style.display="none";




try{


const url =
`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${sku}`;



const response =
await fetch(url);



const files =
await response.json();



let archivesHtml="";

let pdfsHtml="";

let imagesHtml="";

let videosHtml="";





files.sort(
(a,b)=>
a.name.localeCompare(
b.name,
undefined,
{
numeric:true
}
)
);






files.forEach(file=>{


const fileUrl =
file.download_url;


const fileName =
file.name;


const ext =
fileName
.split(".")
.pop()
.toLowerCase();





// 压缩包


if(
[
"zip",
"rar",
"7z"
].includes(ext)
){


archivesHtml +=
`

<a
href="${fileUrl}"
class="file-btn"
target="_blank">

📥 下载 ${fileName}

</a>

`;

}




// PDF


else if(ext==="pdf"){


pdfsHtml +=
`

<a
href="${fileUrl}"
class="file-btn pdf-btn"
target="_blank">

📄 下载 ${fileName}

</a>

`;

}





// 图片


else if(
[
"jpg",
"jpeg",
"png",
"webp",
"gif"
].includes(ext)
){


imagesHtml +=
`

<img

src="${fileUrl}"

loading="lazy"

alt="${fileName}"

onclick="openLightbox('${fileUrl}')"

>

`;

}





// 视频


else if(
[
"mp4",
"webm",
"mov"
].includes(ext)
){


videosHtml +=
`

<video

src="${fileUrl}"

controls

playsinline>

</video>

`;

}



});








// 显示模块



if(archivesHtml){


document.getElementById("archiveLinks")
.innerHTML =
archivesHtml;


document.getElementById("archiveSection")
.style.display="block";


}





if(pdfsHtml){


document.getElementById("pdfLinks")
.innerHTML =
pdfsHtml;


document.getElementById("pdfSection")
.style.display="block";


}






if(imagesHtml){


document.getElementById("imageList")
.innerHTML =
imagesHtml;



document.getElementById("imageSection")
.style.display="block";


}







if(videosHtml){


document.getElementById("videoList")
.innerHTML =
videosHtml;



document.getElementById("videoSection")
.style.display="block";


}





}


catch(error){


console.error(
"加载SKU失败:",
error
);


}


}








/*
===============================
图片灯箱
===============================
*/


function openLightbox(url){


const box =
document.getElementById("lightbox");


const img =
document.getElementById("lightboxImg");



img.src=url;


box.style.display="flex";


}




function closeLightbox(){


document.getElementById("lightbox")
.style.display="none";


}








/*
===============================
搜索
===============================
*/


function filterSKUs(){


const keyword =
document

.getElementById("searchInput")

.value

.trim()

.toLowerCase();




const filtered =
allSKUs.filter(
sku=>
sku
.toLowerCase()
.includes(keyword)
);



renderSKUList(filtered);


}








/*
===============================
返回首页
===============================
*/


function goHome(e){


e.preventDefault();



window.location.hash="";



document.getElementById("detail-view")
.style.display="none";



document.getElementById("home-view")
.style.display="block";



document.getElementById("header-section")
.style.display="flex";


}








/*
===============================
URL直接打开SKU

例如:

xxx.com/#sku=100056

===============================
*/


function checkUrlHash(){


const hash =
window.location.hash;



if(
hash.startsWith("#sku=")
){


const sku =
hash.replace("#sku=","");



if(sku){

loadSKUDetail(sku);

}


}


}







/*
启动
*/


init();



</script>


</body>


</html>
