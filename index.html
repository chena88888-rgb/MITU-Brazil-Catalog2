<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>巴西SKU产品素材目录</title>


<style>


*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}



body{

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Microsoft YaHei",
    sans-serif;


    background:#f8f9fa;

    color:#333;

    padding:20px;

}



/* =====================
首页顶部
===================== */


header{

    max-width:1200px;

    margin:auto;

    display:flex;

    flex-direction:column;

    gap:15px;

}



h1{

    font-size:24px;

    color:#1a73e8;

}



.search-bar{

    width:100%;

    padding:12px 16px;

    border:

    1px solid #ddd;

    border-radius:8px;

    font-size:16px;

}



/* =====================
SKU首页
===================== */


.sku-grid{

    max-width:1200px;

    margin:auto;


    display:grid;


    grid-template-columns:

    repeat(auto-fill,minmax(200px,1fr));


    gap:20px;

}




.sku-card{


    background:white;


    border-radius:10px;


    overflow:hidden;


    box-shadow:

    0 2px 8px rgba(0,0,0,.08);


    cursor:pointer;


    transition:.2s;


    display:flex;


    flex-direction:column;


    align-items:center;


    padding-bottom:10px;


}



.sku-card:hover{


    transform:translateY(-4px);


}




.sku-card img{


    width:200px;

    height:200px;


    object-fit:contain;


    background:#eee;


    border-radius:6px;


    margin-top:10px;


}



.sku-info{


    padding-top:10px;


    font-size:16px;


    font-weight:bold;


}





/* =====================
详情页面
===================== */


.detail-container{


    max-width:1000px;


    margin:auto;


    display:none;


}



.back-btn{


    display:inline-block;


    padding:10px 20px;


    background:white;


    border:1px solid #ddd;


    border-radius:6px;


    text-decoration:none;


    color:#333;


    margin-bottom:20px;


}



.detail-title{


    font-size:24px;


    color:#1a73e8;


    margin-bottom:20px;


}




.section-title{


    font-size:17px;


    font-weight:bold;


    color:#555;


    margin:

    25px 0 12px;


    border-left:

    4px solid #1a73e8;


    padding-left:8px;


}




/* =====================
压缩包下载
===================== */


.file-links{


    display:flex;


    flex-direction:column;


    gap:10px;


}



.file-btn{


    display:block;


    padding:12px;


    background:#e8f0fe;


    color:#1a73e8;


    border-radius:6px;


    text-decoration:none;


    font-weight:bold;


    text-align:center;


}



.archive-btn{

    background:#e6f4ea;

    color:#137333;

}





/* =====================
产品参数HTML展示区域
===================== */


.spec-frame{


    width:100%;


    min-height:500px;


    border:

    1px solid #ddd;


    border-radius:8px;


    background:white;


}





/* =====================
图片/视频网格
===================== */


.media-grid{


    display:grid;


    grid-template-columns:


    repeat(auto-fill,200px);


    gap:20px;


}




.media-grid img,


.media-grid video{


    width:200px;


    height:200px;


    object-fit:contain;


    background:white;


    border-radius:8px;


    cursor:zoom-in;


}




.media-grid video{


    cursor:pointer;


    background:#000;


}





/* =====================
图片放大
===================== */


#lightbox{


    position:fixed;


    top:0;


    left:0;


    width:100%;


    height:100%;


    background:

    rgba(0,0,0,.85);


    display:none;


    justify-content:center;


    align-items:center;


    z-index:999;


}




#lightbox img{


    max-width:95%;


    max-height:95%;


}





.loading{


    text-align:center;


    padding:50px;


    color:#666;


    font-size:18px;


}



</style>


</head>





<body>



<header id="header-section">


<h1>

📦 巴西 SKU 产品素材目录

</h1>



<input

id="searchInput"

class="search-bar"

placeholder="🔍 输入 SKU 快速搜索..."

oninput="filterSKUs()"

/>



</header>





<!-- 首页 -->


<main id="home-view">


<div id="loading" class="loading">


正在读取产品目录...


</div>


<div id="skuGrid" class="sku-grid"></div>


</main>





<!-- SKU详情 -->


<div id="detail-view" class="detail-container">



<a

href="#"

class="back-btn"

onclick="goHome(event)"

>

← 返回首页

</a>



<h2

id="detailTitle"

class="detail-title">

</h2>



<!-- 压缩包 -->


<div id="archiveSection" style="display:none">


<div class="section-title">

📦 压缩包资料下载

</div>


<div id="archiveLinks" class="file-links"></div>


</div>





<!-- 产品参数 -->


<div id="specSection" style="display:none">


<div class="section-title">

📋 产品参数信息

</div>


<iframe

id="specFrame"

class="spec-frame"

></iframe>


</div>





<!-- 图片 -->


<div id="imageSection" style="display:none">


<div class="section-title">

🖼️ 产品高清图集

</div>


<div id="imageList" class="media-grid"></div>


</div>





<!-- 视频 -->


<div id="videoSection" style="display:none">


<div class="section-title">

🎬 产品视频展示

</div>


<div id="videoList" class="media-grid"></div>


</div>




</div>





<div id="lightbox" onclick="closeLightbox()">


<img id="lightboxImg">


</div>


<div id="lightbox" onclick="closeLightbox()">
<img id="lightboxImg">
</div>
<script>


/*
===============================
GitHub配置
===============================
*/


const GITHUB_USER =
"chena88888-rgb";


const REPO_NAME =
"MITU-Brazil-Catalog2";



let catalog = {};

let allSKUs=[];



/*
===============================
初始化
读取 catalog.json
===============================
*/


async function init(){


const loading =
document.getElementById("loading");


try{


const response =
await fetch("catalog.json");


catalog =
await response.json();



allSKUs =
Object.keys(catalog)
.sort(
(a,b)=>
Number(a)-Number(b)
);



loading.style.display="none";


renderSKUList(allSKUs);



checkUrlHash();



}


catch(error){


console.error(error);


loading.innerText =
"catalog.json读取失败";


}


}






/*
===============================
寻找SKU封面

自动找第一张图片

===============================
*/


function findCover(sku){


const files =
catalog[sku].files;



const img =
files.find(
file=>
file.type==="image"
);



if(img){


return img.url;


}



return "default-cover.png";


}







/*
===============================
首页SKU列表
===============================
*/


function renderSKUList(skus){


const grid =
document.getElementById("skuGrid");



grid.innerHTML="";



if(skus.length===0){


grid.innerHTML=

`

<div style="grid-column:1/-1;text-align:center">

没有找到SKU

</div>

`;

return;


}





skus.forEach(sku=>{



const card =
document.createElement("div");



card.className =
"sku-card";



card.innerHTML =

`

<img

src="${findCover(sku)}"

onerror="this.src='default-cover.png'"

>


<div class="sku-info">

SKU: ${sku}

</div>


`;



card.onclick =
()=>loadSKUDetail(sku);



grid.appendChild(card);



});



}







/*
===============================
打开SKU详情
===============================
*/


function loadSKUDetail(sku){



document
.getElementById("home-view")
.style.display="none";



document
.getElementById("header-section")
.style.display="none";



const detail =
document.getElementById("detail-view");



detail.style.display="block";



document
.getElementById("detailTitle")
.innerText=

`SKU: ${sku}`;



window.location.hash =
`sku=${sku}`;




// 清空旧数据


document.getElementById("archiveLinks")
.innerHTML="";


document.getElementById("imageList")
.innerHTML="";


document.getElementById("videoList")
.innerHTML="";



document.getElementById("specFrame")
.src="";




// 隐藏区域


[
"archiveSection",
"specSection",
"imageSection",
"videoSection"

]
.forEach(id=>{

document
.getElementById(id)
.style.display="none";

});





const files =
catalog[sku].files;



let archives="";

let images="";

let videos="";

let spec="";





files.forEach(file=>{





/*
压缩包
*/


if(file.type==="archive"){


archives +=


`

<a

href="${file.url}"

class="file-btn archive-btn"

target="_blank">

📥 下载 ${file.name}

</a>


`;



}





/*
产品参数HTML
*/


else if(
file.name.toLowerCase()
==="product-spec.html"
){


spec =
file.url;



}





/*
图片
*/


else if(
file.type==="image"
){


images +=


`

<img

src="${file.url}"

loading="lazy"

onclick="openLightbox('${file.url}')"

>


`;



}




/*
视频
*/


else if(
file.type==="video"
){



videos +=


`

<video

src="${file.url}"

controls

playsinline

>

</video>


`;



}



});







// 显示压缩包


if(archives){


document
.getElementById("archiveLinks")
.innerHTML=
archives;


document
.getElementById("archiveSection")
.style.display="block";


}







// 显示参数HTML


if(spec){



document
.getElementById("specFrame")
.src=
spec;



document
.getElementById("specSection")
.style.display="block";


}







// 显示图片


if(images){


document
.getElementById("imageList")
.innerHTML=
images;



document
.getElementById("imageSection")
.style.display="block";


}








// 显示视频


if(videos){


document
.getElementById("videoList")
.innerHTML=
videos;



document
.getElementById("videoSection")
.style.display="block";


}





}








/*
===============================
图片放大
===============================
*/


function openLightbox(url){



const box =
document.getElementById("lightbox");

const img =
document.getElementById("lightboxImg");



img.src=url;


box.style.display="flex";



}





function closeLightbox(){


document
.getElementById("lightbox")
.style.display="none";


}







/*
===============================
搜索SKU
===============================
*/


function filterSKUs(){


const keyword =

document
.getElementById("searchInput")
.value
.trim()
.toLowerCase();




const result =

allSKUs.filter(

sku=>

sku
.toLowerCase()
.includes(keyword)

);



renderSKUList(result);



}









/*
===============================
返回首页
===============================
*/


function goHome(e){


e.preventDefault();



window.location.hash="";



document
.getElementById("detail-view")
.style.display="none";



document
.getElementById("home-view")
.style.display="block";



document
.getElementById("header-section")
.style.display="flex";



}








/*
===============================
支持直接打开：

xxx.com/#sku=100062

===============================
*/


function checkUrlHash(){


const hash =
window.location.hash;



if(
hash.startsWith("#sku=")
){


const sku =
hash.replace("#sku=","");



if(
catalog[sku]
){

loadSKUDetail(sku);


}


}



}







/*
启动

*/


init();



</script>


</body>

</html>
